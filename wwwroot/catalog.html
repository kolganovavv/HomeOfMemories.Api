<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог воспоминаний</title>
    <link rel="stylesheet" href="../assets/style/style.css">
</head>
<body>

    <!-- ШАПКА -->
    <header></header>

    <main class="catalog-page">

        <div class="container">
            <div class="catalog-header">
                <h1 class="page-title">Каталог воспоминаний</h1>
                <a href="item.html">
                    <button class="btn btn-dark random-btn">Случайное воспоминание</button>
                </a>
            </div>


            <div class="catalog-layout">
                <!-- ФИЛЬТРЫ -->
                <aside class="filters-sidebar">
                    <h2 class="filters-title">Фильтры</h2>

                    <div class="filter-group">
                        <label class="filter-label">Категории</label>
                        <div class="filter-tags">
                            <button class="filter-tag active">Все</button>
                            <button class="filter-tag">Игрушки</button>
                            <button class="filter-tag">Мебель</button>
                            <button class="filter-tag">Рукоделие</button>
                            <button class="filter-tag">Одежда</button>
                            <button class="filter-tag">Аксессуары</button>
                            <button class="filter-tag">Печать</button>
                            <button class="filter-tag">Техника</button>
                            <button class="filter-tag">Природа</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Годы</label>
                        <div class="filter-tags">
                            <button class="filter-tag active">Все</button>
                            <button class="filter-tag">1950-е</button>
                            <button class="filter-tag">1960-е</button>
                            <button class="filter-tag">1970-е</button>
                            <button class="filter-tag">1980-е</button>
                            <button class="filter-tag">1990-е</button>
                            <button class="filter-tag">2000-е</button>
                            <button class="filter-tag">2010-е</button>
                            <button class="filter-tag">2020-е</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Эмоции</label>
                        <div class="filter-tags">
                            <button class="filter-tag active">Все</button>
                            <button class="filter-tag">🤗 Тёплые</button>
                            <button class="filter-tag">😊 Ностальгия</button>
                            <button class="filter-tag">😃 Радостные</button>
                            <button class="filter-tag">🤔 Удивительные</button>
                            <button class="filter-tag">✍️ Интересные</button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Сортировка</label>
                        <div class="filter-sort">
                            <button class="filter-tag active">По популярности</button>
                            <button class="filter-tag">По дате публикации</button>
                            <button class="filter-tag">По году</button>
                            <button class="filter-tag">По количеству оценок</button>
                        </div>
                    </div>
                </aside>

                <!-- КАРТОЧКИ -->
                <div class="catalog-right">
                    <div class="catalog-grid" id="catalogGrid">

                    </div>
                    <!-- пагинация (перспектива для масштабирования)
                    <div class="dots">
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                        <button class="page-btn">3</button>
                        <button class="page-btn">4</button>
                        ...
                        <button class="page-btn">12</button>
                    </div>-->
                </div>
            </div>
        </div>

    </main>

    <!-- ПОДВАЛ -->
    <footer></footer>

    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
    <script>
        renderHeader();
        renderFooter();
    </script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/translate.js"></script>

    <!-- получение информации из бд, вывод её в карточки -->
    <script>
        console.log("Скрипт каталога запущен!");

        async function loadCatalog() {
            const grid = document.getElementById('catalogGrid');

            if (!grid) {
                console.error("ОШИБКА: Не найден div с id='catalogGrid'!");
                return;
            }

            try {
                console.log("Запрашиваем данные с сервера...");
                const response = await fetch('/api/memories');
                const memories = await response.json();

                console.log("Получены данные:", memories);

                if (!memories || memories.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; width:100%;">Пока нет ни одного воспоминания.</p>';
                    return;
                }

                // генерация карточек
                grid.innerHTML = memories.map(m => {
                    const imgUrl = m.cover ? `/${m.cover}` : 'assets/image/picture/phone.jpg';

                    return `
                    <a href="item.html?id=${m.id}" class="catalog-card">
                        <div class="card-image" style="--bg: url('${imgUrl}')"></div>
                        <div class="card-content">
                            <h3 class="card-title">${m.title}</h3>
                            <p class="card-desc">${m.story}</p>
                            <div class="card-meta">
                                <div class="author">
                                    <img src="../assets/image/icon/interact/no-pfp.svg" alt="Автор">
                                    <span>${m.author}</span>
                                </div>
                                <div class="likes">
                                    <img class="heart" src="assets/image/icon/interact/heart.svg" alt="Оценки">
                                    <span>0</span>
                                </div>
                            </div>
                            <div class="card-tags">
                                <span class="tag">${m.category}</span>
                                <span class="tag">${m.yearLabel || 'Год не указан'}</span>
                            </div>
                        </div>
                    </a>
                    `;
                }).join('');

                console.log("Карточки успешно добавлены на страницу.");

            } catch (error) {
                console.error("Ошибка при загрузке:", error);
                grid.innerHTML = '<p style="color:red; text-align:center; width:100%;">Ошибка загрузки каталога.</p>';
            }
        }

        // запуск загрузки по прорисовке всей страницы
        document.addEventListener("DOMContentLoaded", loadCatalog);
    </script>
</body>
</html>
